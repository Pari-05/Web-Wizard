<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Secure Notes</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated background -->
    <div class="bg-animation" id="bgAnimation"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1><i class="fas fa-sticky-note"></i> Secure Notes</h1>
            <p>Beautiful. Secure. Synchronized.</p>
        </div>

        <!-- Signup Container -->
        <div class="auth-container">
            <div class="auth-card glass-strong">
                <div class="text-center mb-4">
                    <h2 style="color: var(--text-primary); font-size: 2rem; margin-bottom: 0.5rem;">Create Account</h2>
                    <p style="color: var(--text-secondary);">Join us and start organizing your thoughts</p>
                </div>

                <div id="alertContainer"></div>

                <!-- Signup Form -->
                <div id="signupForm">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                        <i class="fas fa-user"></i>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Create a password (min 6 characters)" required minlength="6">
                        <i class="fas fa-lock"></i>
                    </div>
                    
                    <button type="submit" class="btn" id="signupBtn">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>
                </div>

                <!-- Navigation -->
                <div class="text-center mt-4">
                    <p style="color: var(--text-secondary); margin-bottom: 10px;">Already have an account?</p>
                    <a href="login.html" class="nav-link" style="display: inline-flex;">
                        <i class="fas fa-sign-in-alt"></i>
                        Sign In
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="signup.js"></script>
</body>
</html>
